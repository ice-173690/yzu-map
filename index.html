<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>元智大學高精度動態定位系統</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html,body{width:100%;height:100%;margin:0;padding:0;font-family:"Microsoft JhengHei",sans-serif;background:#f4f6f9;}
        .page{display:none;width:100%;height:100%;box-sizing:border-box;}
        #home-page{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;}
        .logo-area{margin-bottom:20px;text-align:center;}
        .logo-area h1{color:#003366;margin:0;font-size:28px;}
        .role-card{width:100%;max-width:320px;background:white;padding:20px;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,0.05);margin-bottom:15px;box-sizing:border-box;}
        .role-card h2{margin:0 0 10px 0;font-size:18px;}
        .btn{width:100%;padding:14px 0;font-size:16px;font-weight:bold;color:white;border:none;border-radius:10px;cursor:pointer;margin-top:5px;box-shadow:0 4px 8px rgba(0,0,0,0.1);}
        .btn-blue{background:#007bff;}
        .btn-green{background:#28a745;}
        .btn-red{background:#dc3545;}
        .input-style{width:100%;padding:12px;font-size:16px;border:2px solid #ddd;border-radius:8px;box-sizing:border-box;margin-bottom:10px;}
        .map-container{height:45%;width:100%;background:#222;}
        .control-panel{height:55%;width:100%;background:white;box-shadow:0 -4px 15px rgba(0,0,0,0.1);border-radius:24px 24px 0 0;position:absolute;bottom:0;z-index:1000;box-sizing:border-box;padding:15px;text-align:center;overflow-y:auto;}
        .status-badge{display:inline-block;padding:5px 15px;color:white;border-radius:20px;font-size:14px;font-weight:bold;margin:5px 0;}
        .status-available{background:#28a745;}
        .status-busy{background:#dc3545;}
        .back-home{position:absolute;top:10px;left:10px;z-index:1001;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold;text-decoration:none;color:#333;}
        .inbox-area{margin-top:12px;padding:10px;border-top:2px dashed #eee;text-align:left;}
        .inbox-title{font-size:14px;font-weight:bold;display:flex;justify-content:space-between;margin-bottom:5px;}
        .message-item{background:#fff3cd;border-left:4px solid #ffc107;padding:8px 12px;border-radius:4px;margin-bottom:6px;font-size:13px;color:#856404;}
        .select-style{width:48%;padding:10px;font-size:14px;border:2px solid #28a745;border-radius:8px;margin-top:5px;background-color:#f8fff9;display:inline-block;}
    </style>
</head>
<body>

    <div id="home-page" class="page" style="display:flex;">
        <div class="logo-area"><h1>元智高精度導覽系統</h1><p>YZU Smart GPS Station</p></div>
        <div class="role-card">
            <h2>🙋 我是學生</h2>
            <input type="text" id="student-self-name" class="input-style" placeholder="請輸入您的姓名或學號...">
            <input type="text" id="search-name" class="input-style" placeholder="輸入想找的老師姓名...">
            <button class="btn btn-blue" onclick="enterStudentView()">搜尋老師並查看定位</button>
        </div>
        <div class="role-card">
            <h2>👨‍🏫 我是老師</h2>
            <input type="text" id="teacher-login-name" class="input-style" placeholder="請輸入您的姓名...">
            <button class="btn btn-green" onclick="enterTeacherView()">登入並開始回報定位</button>
        </div>
    </div>

    <div id="student-page" class="page">
        <a href="#" class="back-home" onclick="goHome()">⬅ 返回首頁</a>
        <div id="student-map" class="map-container"></div>
        <div class="control-panel">
            <h3 id="view-teacher-title">讀取中...</h3>
            <p id="view-teacher-location">正在獲取位置...</p>
            <p id="distance-indicator" style="font-size:14px; color:#6f42c1; font-weight:bold; margin:3px 0;"></p>
            <div id="view-teacher-badge" class="status-badge status-available">方便訪客</div>
            <button class="btn btn-blue" onclick="requestTeacher()">🔔 發出「我要找老師」請求</button>
        </div>
    </div>

    <div id="teacher-page" class="page">
        <a href="#" class="back-home" onclick="goHome()">⬅ 返回首頁</a>
        <div id="teacher-map" class="map-container"></div>
        <div class="control-panel">
            <h3 id="teacher-welcome-title">歡迎回來</h3>
            <p id="self-location-text">正在讀取校園圖資...</p>
            
            <div style="background:#e8f5e9; padding:10px; border-radius:12px; margin-bottom:8px; text-align:left;">
                <label style="font-size:13px; font-weight:bold; color:#1b5e20; display:block;">🏢 室內高精度微調校正：</label>
                <div style="display:flex; justify-content:space-between;">
                    <select id="building-select" class="select-style" onchange="updateFloorOptions()">
                        <option value="">-- 使用 GPS 自動偵測 --</option>
                        <option value="0">一館</option>
                        <option value="1">二館</option>
                        <option value="2">三館</option>
                        <option value="3">五館</option>
                        <option value="4">六館</option>
                        <option value="5">七館</option>
                    </select>
                    <select id="floor-select" class="select-style" onchange="correctLocationManually()" disabled>
                        <option value="">-- 請先選擇大樓 --</option>
                    </select>
                </div>
            </div>

            <div style="margin-top:5px;">
                <button class="btn btn-green" style="width:45%;margin:0 5px;padding:10px 0;" onclick="setTeacherStatus(true)">🟢 方便</button>
                <button class="btn btn-red" style="width:45%;margin:0 5px;padding:10px 0;" onclick="setTeacherStatus(false)">🔴 忙碌</button>
            </div>
            <div class="inbox-area">
                <div class="inbox-title">
                    <span>📥 學生預約收件匣 <b style="color:red;" id="msg-count"></b></span>
                    <button onclick="clearInbox()" style="font-size:11px;background:#6c757d;color:white;border:none;padding:2px 6px;border-radius:4px;">清除已讀</button>
                </div>
                <div id="inbox-list"><div style="font-size:13px;color:#999;text-align:center;">目前沒有收到請求。</div></div>
            </div>
        </div>
    </div>

    <script>
        // 館舍地理資產資料庫 (五館暨圖書館已修正為元智五館)
        const yzuBuildings=[
            {name:"元智一館",y:750,x:600, minFloor:-1, maxFloor:7},
            {name:"元智二館",y:650,x:700, minFloor:-1, maxFloor:7},
            {name:"元智三館",y:550,x:750, minFloor:-1, maxFloor:7},
            {name:"元智五館",y:350,x:650, minFloor:-1, maxFloor:6},
            {name:"元智六館",y:200,x:450, minFloor:-1, maxFloor:10},
            {name:"元智七館",y:350,x:200, minFloor:-1, maxFloor:10}
        ];

        const mockStudentCoords = {y: 500, x: 550}; 
        let onlineTeachersDatabase=[{name:"張教授",y:350,x:650,isAvailable:true,locationName:"元智五館 3 樓辦公室"},{name:"林教授",y:200,x:450,isAvailable:false,locationName:"元智六館"}];
        let currentOperatingTeacher="",studentMap,teacherMap,studentMarker,teacherMarker,teacherGpsWatchId=null,inboxCheckInterval=null,targetTeacherName="";
        const imageBounds=[[0,0],[1000,1000]];

        function gpsToImagePixels(lat,lng){
            let y=((lat-24.966)/(24.974-24.966))*1000;let x=((lng-121.258)/(121.268-121.258))*1000;
            return {y:Math.max(0,Math.min(1000,y)),x:Math.max(0,Math.min(1000,x))};
        }
        function calculateClosestBuilding(y,x){
            let closest="校外區域",minDist=99999;
            yzuBuildings.forEach(b=>{let d=Math.sqrt(Math.pow(y-b.y,2)+Math.pow(x-b.x,2));if(d<minDist){minDist=d;closest=b.name;}});return closest;
        }
        function showPage(id){document.querySelectorAll('.page').forEach(p=>p.style.display='none');document.getElementById(id).style.display=(id==='home-page')?'flex':'block';}
        function goHome(){if(teacherGpsWatchId!==null){navigator.geolocation.clearWatch(teacherGpsWatchId);teacherGpsWatchId=null;}if(inboxCheckInterval!==null){clearInterval(inboxCheckInterval);inboxCheckInterval=null;}showPage('home-page');}
        
        function createCustomImageMap(id){
            const m=L.map(id,{crs:L.CRS.Simple,minZoom:-1,maxZoom:2,maxBounds:imageBounds,maxBoundsViscosity:1.0});
            L.imageOverlay('yzu-map.png',imageBounds).addTo(m);m.fitBounds(imageBounds);
            yzuBuildings.forEach(b => { L.marker([b.y, b.x]).addTo(m).bindPopup(b.name); });
            return m;
        }

        // ──── 🙋 學生端功能 ────
        function enterStudentView(){
            const sName=document.getElementById('student-self-name').value.trim();const sSearch=document.getElementById('search-name').value.trim();
            if(!sName||!sSearch){alert("請輸入您的姓名以及要搜尋的老師！");return;}
            const t=onlineTeachersDatabase.find(o=>o.name===sSearch);if(!t){alert("查無此人！請輸入「張教授」或「林教授」測試！");return;}
            targetTeacherName=sSearch;showPage('student-page');
            
            if(!studentMap){
                studentMap=createCustomImageMap('student-map');
                studentMarker=L.circleMarker([t.y,t.x],{color:'#007bff',fillColor:'#007bff',fillOpacity:0.8,radius:10}).addTo(studentMap);
                L.marker([mockStudentCoords.y, mockStudentCoords.x]).addTo(studentMap).bindPopup("🙋 我在這裡 (大草皮)");
            }
            
            let pixelDist = Math.sqrt(Math.pow(mockStudentCoords.y - t.y, 2) + Math.pow(mockStudentCoords.x - t.x, 2));
            let meters = Math.round(pixelDist * 0.4);let minutes = Math.ceil(meters / 80);
            document.getElementById('distance-indicator').innerText = `📍 您距離老師約 ${meters} 公尺 (步行預計 ${minutes} 分鐘)`;

            document.getElementById('view-teacher-title').innerText=`工管系 ${t.name}`;
            document.getElementById('view-teacher-location').innerText=`目前位置：在 ${t.locationName}`;
            const b=document.getElementById('view-teacher-badge');b.innerText=t.isAvailable?"方便訪客":"忙碌中";b.className=t.isAvailable?"status-badge status-available":"status-badge status-busy";
            studentMarker.setLatLng([t.y,t.x]);studentMap.panTo([t.y,t.x]);
        }

        function requestTeacher(){
            const sName=document.getElementById('student-self-name').value.trim();const now=new Date();const time=`${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            let reqs=JSON.parse(localStorage.getItem('yzu_reqs'))||[];reqs.push({id:Date.now(),teacher:targetTeacherName,student:sName,time:time});
            localStorage.setItem('yzu_reqs',JSON.stringify(reqs));alert(`已成功發送會面請求給 ${targetTeacherName}！`);
        }

        // ──── 👨‍🏫 老師端功能 ────
        function enterTeacherView(){
            const tName=document.getElementById('teacher-login-name').value.trim();if(!tName){alert("請輸入您的姓名！");return;}
            currentOperatingTeacher=tName;document.getElementById('teacher-welcome-title').innerText=`歡迎回來，${tName} 老師`;
            let rec=onlineTeachersDatabase.find(o=>o.name===currentOperatingTeacher);
            if(!rec){rec={name:currentOperatingTeacher,y:350,x:650,isAvailable:true,locationName:"元智五館"};onlineTeachersDatabase.push(rec);}
            showPage('teacher-page');
            
            if(!teacherMap){
                teacherMap=createCustomImageMap('teacher-map');
                teacherMarker=L.circleMarker([rec.y,rec.x],{color:'#dc3545',fillColor:'#dc3545',fillOpacity:0.8,radius:10}).addTo(teacherMap);
            }
            updateTeacherInbox();inboxCheckInterval=setInterval(updateTeacherInbox,1500);
            
            if(navigator.geolocation){
                document.getElementById('self-location-text').innerText="⏳ 正在獲取手機 GPS 定位...";
                teacherGpsWatchId=navigator.geolocation.watchPosition(p=>{
                    if (document.getElementById('building-select').value === "") {
                        const coords=gpsToImagePixels(p.coords.latitude,p.coords.longitude);const bld=calculateClosestBuilding(coords.y,coords.x);
                        let target=onlineTeachersDatabase.find(o=>o.name===currentOperatingTeacher);if(target){target.y=coords.y;target.x=coords.x;target.locationName=bld;}
                        document.getElementById('self-location-text').innerText=`📡 GPS 自動追蹤：目前在大致在 ${bld}`;
                        teacherMarker.setLatLng([coords.y,coords.x]);teacherMap.panTo([coords.y,coords.x]);
                    }
                },e=>{document.getElementById('self-location-text').innerText="ℹ️ 室內無法取得精確 GPS。請利用下方選單手動校正樓層。";},{enableHighAccuracy:true,timeout:10000,maximumAge:0});
            }
        }

        function updateFloorOptions() {
            const bIdx = document.getElementById('building-select').value;
            const fSelect = document.getElementById('floor-select');
            
            if(bIdx === "") {
                fSelect.innerHTML = '<option value="">-- 請先選擇大樓 --</option>';
                fSelect.disabled = true;
                enterTeacherView();
                return;
            }

            fSelect.disabled = false;
            const building = yzuBuildings[parseInt(bIdx)];
            let html = '<option value="">-- 請選擇確切樓層 --</option>';
            
            for(let f = building.minFloor; f <= building.maxFloor; f++) {
                if(f === 0) continue; 
                let label = f < 0 ? `地下 ${Math.abs(f)} 層 (B${Math.abs(f)})` : `地上 ${f} 層 (${f}F)`;
                html += `<option value="${f}">${label}</option>`;
            }
            fSelect.innerHTML = html;
        }

        function correctLocationManually() {
            const bIdx = document.getElementById('building-select').value;
            const floor = document.getElementById('floor-select').value;
            if(bIdx === "" || floor === "") return;

            const selectedBuilding = yzuBuildings[parseInt(bIdx)];
            let floorLabel = floor < 0 ? `B${Math.abs(floor)}` : `${floor}F`;
            let fullLocationDescription = `${selectedBuilding.name} 的 ${floorLabel} 辦公室`;

            let target = onlineTeachersDatabase.find(o=>o.name===currentOperatingTeacher);
            if(target){
                target.y = selectedBuilding.y;
                target.x = selectedBuilding.x;
                target.locationName = fullLocationDescription;
            }

            document.getElementById('self-location-text').innerText=`🏢 已啟動高精度校正：鎖定在【${fullLocationDescription}】`;
            teacherMarker.setLatLng([selectedBuilding.y, selectedBuilding.x]);
            teacherMap.panTo([selectedBuilding.y, selectedBuilding.x]);
        }

        function updateTeacherInbox(){
            const reqs=JSON.parse(localStorage.getItem('yzu_reqs'))||[];const myReqs=reqs.filter(r=>r.teacher===currentOperatingTeacher);
            const list=document.getElementById('inbox-list');const badge=document.getElementById('msg-count');
            if(myReqs.length===0){badge.innerText="";list.innerHTML='<div style="font-size:13px;color:#999;text-align:center;">目前沒有收到請求。</div>';}
            else{badge.innerText=`(${myReqs.length})`;let html="";myReqs.forEach(r=>{html+=`<div class="message-item"><span>⏱️ [${r.time}] <b>${r.student}</b> 同學發起請求</span></div>`;});list.innerHTML=html;}
        }
        function clearInbox(){
            let reqs=JSON.parse(localStorage.getItem('yzu_reqs'))||[];reqs=reqs.filter(r=>r.teacher!==currentOperatingTeacher);
            localStorage.setItem('yzu_reqs',JSON.stringify(reqs));updateTeacherInbox();alert("收件匣已清空！");
        }
        function setTeacherStatus(st){let target=onlineTeachersDatabase.find(o=>o.name===currentOperatingTeacher);if(target){target.isAvailable=st;alert("狀態已更新！");}}
    </script>
</body>
</html>
